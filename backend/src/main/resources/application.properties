spring.application.name=sga-soporte-backend
server.port=${PORT:5178}

# --- Base de datos (usada por DataSourceConfig para armar la URL JDBC) ---
db.host=${DB_HOST}
db.port=${DB_PORT:5432}
db.name=${DB_NAME}
db.user=${DB_USER}
db.password=${DB_PASSWORD}
db.ssl=${DB_SSL:false}

# --- JWT (mismo secret que sga-principal) ---
app.jwt.secret=${JWT_SECRET}

# --- CORS ---
app.cors.origin=${CORS_ORIGIN:*}

# --- sga-principal via gRPC (host/puerto donde corre su servidor gRPC) ---
principal.grpc.host=${PRINCIPAL_GRPC_HOST:localhost}
principal.grpc.port=${PRINCIPAL_GRPC_PORT:9092}

# --- Correo (notifica al usuario que reporto un ticket cuando cambia de estado) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME:soporte@sga.edu.ec}
# Si MAIL_USERNAME no esta configurado, EmailService detecta la falta de
# credenciales y solo loguea en vez de intentar enviar (no rompe el flujo
# de actualizar un ticket).

# --- Frontend estatico (dist), relativo al working directory del proceso ---
# (el working directory se fija en la raiz del repo, ver spring-boot-maven-plugin en pom.xml)
app.frontend.dist-path=${FRONTEND_DIST_PATH:dist}

# --- Jackson: fechas como ISO-8601, no timestamps epoch ---
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.root=INFO
logging.level.ec.uteq.sga.soporte=DEBUG
